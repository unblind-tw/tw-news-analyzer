name: Daily Political News Analyzer

on:
  schedule:
    # 錯開整點 00 分尖峰，改為 07 分與 37 分確保準時觸發
    # 台灣時間 08:07 (UTC 00:07) 早報
    - cron: '7 0 * * *'
    # 台灣時間 12:37 (UTC 04:37) 午報
    - cron: '37 4 * * *'
    # 台灣時間 19:07 (UTC 11:07) 晚報
    - cron: '7 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run News Fetch and Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_analyze.py

      - name: Commit and Push updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "News Analyzer Bot"
          git add news_history.json
          git diff --staged --quiet || (git commit -m "Auto update news analysis" && git pull --rebase origin main && git push)
