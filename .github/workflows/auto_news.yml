name: Daily Political News Analyzer

on:
  schedule:
    # 台灣時間 08:00 (UTC 00:00) 早報
    - cron: '0 0 * * *'
    # 台灣時間 12:30 (UTC 04:30) 午報
    - cron: '30 4 * * *'
    # 台灣時間 19:00 (UTC 11:00) 晚報
    - cron: '0 11 * * *'
  workflow_dispatch: # 允許手動一鍵觸發測試

permissions:
  contents: write

jobs:
  analyze_news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run News Fetch and Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_analyze.py

      - name: Commit and Push updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "News Analyzer Bot"
          git add news_history.json
          git diff --staged --quiet || git commit -m "Auto update news analysis"
          git push
