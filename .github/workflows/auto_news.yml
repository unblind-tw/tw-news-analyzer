name: Daily Political News Analyzer

on:
  schedule:
    # 台灣時間 07:45 (UTC 23:45) 早報 — 徹底避開 UTC 00:00 全球午夜大塞車
    - cron: '45 23 * * *'
    # 台灣時間 12:23 (UTC 04:23) 午報 — 避開整點與半點尖峰
    - cron: '23 4 * * *'
    # 台灣時間 18:53 (UTC 10:53) 晚報 — 避開 19:00 整點尖峰
    - cron: '53 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run News Fetch and Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_analyze.py

      - name: Commit and Push updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "News Analyzer Bot"
          git add news_history.json
          git diff --staged --quiet || (git commit -m "Auto update news analysis" && git pull --rebase origin main && git push)
